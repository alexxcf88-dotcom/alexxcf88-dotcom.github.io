  <defs>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--ai-grad-a, #5AF0D8)"/>
      <stop offset="1" stop-color="var(--ai-grad-b, #35C9F0)"/>
    </linearGradient>
  </defs>
  <style>
    .ai{fill:url(#ai-grad)}
    .ai-dim{fill:url(#ai-grad);opacity:.26}
    .body{fill:var(--ai-ink, #ffffff)}
    .body-dim{fill:var(--ai-ink, #ffffff);opacity:.30}
    .bar{transform:scaleY(0);animation:bar .34s cubic-bezier(.2,.9,.3,1.3) forwards}
    .b0{animation-delay:.05s} .b1{animation-delay:.15s} .b2{animation-delay:.25s} .b3{animation-delay:.35s}
    @keyframes bar{to{transform:scaleY(1)}}
    .dseg{opacity:0;animation:seg .18s linear forwards}
    .d0{animation-delay:.20s} .d1{animation-delay:.26s} .d2{animation-delay:.32s} .d3{animation-delay:.38s} .d4{animation-delay:.44s} .d5{animation-delay:.50s} .d6{animation-delay:.56s} .d7{animation-delay:.62s} .d8{animation-delay:.68s} .d9{animation-delay:.74s} .d10{animation-delay:.80s}
    .dot{opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;
         animation:dot .5s linear forwards;animation-delay:1.02s}
    @keyframes seg{to{opacity:1}}
    @keyframes dot{
      0%{opacity:0;transform:scale(0)}
      30%{opacity:1;transform:scale(1.35)}
      62%{transform:scale(.92)}
      100%{opacity:1;transform:scale(1)}
    }
    @media (prefers-reduced-motion: reduce){
      .bar,.dseg,.dot{animation:none}
      .bar{transform:scaleY(1)} .dseg{opacity:1} .dot{opacity:1;transform:none}
    }
  </style>
